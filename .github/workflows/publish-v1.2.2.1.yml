name: Publish MKC v1.2.2.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.2.2.1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified artifact from merged main build
        env:
          ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-5600-820e-ab2d-77dd6e8374f1/raw?se=2026-10-28T01%3A47%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=e396e7ee-4d17-52a4-99ec-cb0aac9657cd&skoid=0a91ee30-885e-46c5-aa98-ae8c7359b1d8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-27T13%3A49%3A23Z&ske=2026-10-28T13%3A49%3A23Z&sks=b&skv=2026-02-06&sig=IIZoFSGp00b7nWnAy9HXul5XPhKaQRWA7LYggdz%2BXpQ%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          test -f artifact/Master-Key-Controls-Windows-x64.zip
          test -f artifact/SHA256.txt

      - name: Verify release payload
        run: |
          set -euo pipefail
          expected="$(tr -d '\r\n ' < artifact/SHA256.txt | tr '[:upper:]' '[:lower:]')"
          actual="$(sha256sum artifact/Master-Key-Controls-Windows-x64.zip | awk '{print $1}')"
          echo "Expected: $expected"
          echo "Actual:   $actual"
          test "$expected" = "$actual"
          test "$actual" = "158e2c05134f6f2857e5fe107bbe160e8c188681a600eb18df2e6a2a623691d7"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.2.2.1 \
            artifact/Master-Key-Controls-Windows-x64.zip#Master-Key-Controls-Windows-x64.zip \
            artifact/SHA256.txt#SHA256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Master Key Controls v1.2.2.1" \
            --notes "Actualización del panel de consultas para AyRPC 2026: muestra siempre las 12 clases, pregunta qué clase está activa al abrir Consultas y guarda cada nueva consulta de Twitch en la clase elegida, sin depender del inicio de asistencia. También corrige el recorte visual del selector de clase en Windows."
