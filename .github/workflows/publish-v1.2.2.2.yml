name: Publish MKC v1.2.2.2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.2.2.2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified artifact from merged main build
        env:
          ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-ff58-820e-8923-cdec5e39cae2/raw?se=2026-11-01T06%3A01%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=1e144ac4-67a3-5c2a-b6d8-f0e22edaa17e&skoid=0a91ee30-885e-46c5-aa98-ae8c7359b1d8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-01T00%3A47%3A38Z&ske=2026-11-02T00%3A47%3A38Z&sks=b&skv=2026-02-06&sig=OtY3U9MRs/70k9MKsVYTGqdmVPwlaWNrCKI5VIjbqtE%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          test -f artifact/Master-Key-Controls-Windows-x64.zip
          test -f artifact/SHA256.txt

      - name: Verify release payload
        run: |
          set -euo pipefail
          expected="$(tr -d '\r\n ' < artifact/SHA256.txt | tr '[:upper:]' '[:lower:]')"
          actual="$(sha256sum artifact/Master-Key-Controls-Windows-x64.zip | awk '{print $1}')"
          echo "Expected: $expected"
          echo "Actual:   $actual"
          test "$expected" = "$actual"
          test "$actual" = "532ebced9287af0a57315cecdfbf2c570fad7d1d119105671091f5610b0a124b"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.2.2.2 \
            artifact/Master-Key-Controls-Windows-x64.zip#Master-Key-Controls-Windows-x64.zip \
            artifact/SHA256.txt#SHA256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Master Key Controls v1.2.2.2" \
            --notes "Hotfix del panel de consultas de AyRPC 2026. Evita reconstruir pestañas y grillas en cada refresh, mantiene fija la clase que está mirando el moderador, conserva selección y check/tachado, actualiza estados sobre la misma fila y agrega las consultas nuevas al final sin hacer saltar la vista. Probado manualmente y con 112/112 pruebas automáticas aprobadas."
