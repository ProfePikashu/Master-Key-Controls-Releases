name: Publish MKC v1.2.2.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.2.2.0.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified artifact from merged main build
        env:
          ARTIFACT_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-222c-820e-9dfd-f6480cdf03c5/raw?se=2026-10-27T23%3A02%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=50560c09-2b1e-5348-8306-dc35f37ebf71&skoid=0a91ee30-885e-46c5-aa98-ae8c7359b1d8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-27T12%3A56%3A21Z&ske=2026-10-28T12%3A56%3A21Z&sks=b&skv=2026-02-06&sig=cUpoJfNvg1/T0yarMAwYDlL9eAxdReoWvQisxfvSZLU%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$ARTIFACT_URL" --output artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          test -f artifact/Master-Key-Controls-Windows-x64.zip
          test -f artifact/SHA256.txt

      - name: Verify release payload
        run: |
          set -euo pipefail
          expected="$(tr -d '\r\n ' < artifact/SHA256.txt | tr '[:upper:]' '[:lower:]')"
          actual="$(sha256sum artifact/Master-Key-Controls-Windows-x64.zip | awk '{print $1}')"
          echo "Expected: $expected"
          echo "Actual:   $actual"
          test "$expected" = "$actual"
          test "$actual" = "ed16c9a0761329b6547896407ae07e79a40c442e1037d2f4de41f3ccb82a1d0d"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.2.2.0 \
            artifact/Master-Key-Controls-Windows-x64.zip#Master-Key-Controls-Windows-x64.zip \
            artifact/SHA256.txt#SHA256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Master Key Controls v1.2.2.0" \
            --notes "Mejoras del panel de consultas para moderadores: colores por estado, pestañas por clase, selección estable durante refresh, check/tachado local y ajuste automático de consultas largas. Incluye actualización in-place desde 1.2.2 con backup, reemplazo del ejecutable y rollback existentes."
